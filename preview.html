<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세이렌 토벌 미리보기</title>
<style>body{margin:0;background:#f3e9d5;color:#352f2b;font-family:system-ui,sans-serif}main{max-width:1080px;margin:28px auto;padding:0 22px}h1{margin:0 0 6px;color:#254a66}p{margin:0 0 18px;color:#766b60}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fffaf0;border:1px solid #e7d7bd;border-radius:20px;padding:18px;box-shadow:0 5px 18px #59462612}.card h2{font-size:19px;margin:0 0 12px}.card canvas{display:block;width:100%;height:auto;border-radius:13px;background:#e7d9be}.full{grid-column:1/-1}#crew{height:185px!important}.tagrow{display:flex;justify-content:space-around;margin-top:6px;font-weight:700;color:#695644}.note{font-size:13px;color:#827669;margin-top:9px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style>
<main><h1>세이렌 토벌 · 그림 미리보기</h1><p>현재 게임에서 사용하는 아군 캐릭터, 획득 무기, 세이렌 이미지</p><div class="grid">
<section class="card full"><h2>토벌대 캐릭터</h2><canvas id="crew" width="1000" height="240"></canvas><div class="tagrow"><span>흰 햄스터</span><span>치이카와</span><span>하치와레</span><span>우사기</span><span>랏코</span><span>쿠리만쥬</span></div></section>
<section class="card full"><h2>무기</h2><canvas id="weapons" width="1000" height="250"></canvas><div class="tagrow"><span>+50</span><span>+100 분홍/파랑</span><span>+500</span><span>+1,000</span></div><p class="note">게임 화면과 동일한 아이콘 비율로 표시했습니다.</p></section>
<section class="card full"><h2>세이렌</h2><canvas id="boss" width="1000" height="450"></canvas></section>
</div></main>
<script type="module">
import {GameRenderer} from './src/render/GameRenderer.js';
const wait=img=>img.complete&&img.naturalWidth?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve});
const setup=id=>new GameRenderer(document.getElementById(id));
const crew=setup('crew'), weapons=setup('weapons'), boss=setup('boss');
await Promise.all(Object.values(crew.images).map(wait)); await Promise.all(Object.values(weapons.images).map(wait)); await Promise.all(Object.values(boss.images).map(wait));
let c=crew.context;c.fillStyle='#eee1c9';c.fillRect(0,0,crew.width,crew.height);['chiikawa','hachiwore','usagi','rakkko','kurimanju'].forEach((kind,i)=>{const image=crew.images[`crew${i+1}`],h=122,w=h*image.naturalWidth/image.naturalHeight;c.drawImage(image,55+i*180,32,w,h);});
c=weapons.context;c.fillStyle='#eee1c9';c.fillRect(0,0,weapons.width,weapons.height);['bowl','forkPink','forkBlue','stick','sword'].forEach((key,i)=>weapons.drawWeapon({weaponKey:key==='forkPink'||key==='forkBlue'?'fork':key,weaponVariant:key==='forkBlue'?'blue':'pink',bonus:[50,100,100,500,1000][i],lane:[.12,.31,.48,.68,.88][i],depth:.88}));
c=boss.context;c.fillStyle='#183f67';c.fillRect(0,0,boss.width,boss.height);const ocean=boss.images.ocean;c.globalAlpha=.8;c.drawImage(ocean,0,0,boss.width,boss.height);c.globalAlpha=1;c.shadowColor='#081b36aa';c.shadowBlur=18;c.drawImage(boss.images.siren,290,10,420,420);c.shadowBlur=0;
</script></html>
